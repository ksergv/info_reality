<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Statistics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .summary {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            padding: 20px 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th:last-child,
        td:last-child {
            text-align: right;
        }
    </style>
</head>

<body>

<h1>Site Statistics</h1>

<div class="summary">
    <div class="card">
        <div>Today</div>
        <div class="number" id="today">—</div>
    </div>

    <div class="card">
        <div>Total views</div>
        <div class="number" id="total">—</div>
    </div>
</div>

<h2>Page Views</h2>

<table>
    <thead>
        <tr>
            <th>Page</th>
            <th>Views</th>
        </tr>
    </thead>
    <tbody id="pages">
    </tbody>
</table>

<script>
fetch("https://sksek.duckdns.org/counter/stats")
    .then(response => response.json())
    .then(data => {

        document.getElementById("today").textContent = data.today;
        document.getElementById("total").textContent = data.total;

        const tbody = document.getElementById("pages");

        data.pages.forEach(item => {
            const row = document.createElement("tr");

            const page = document.createElement("td");
            page.textContent = item.page;

            const views = document.createElement("td");
            views.textContent = item.views;

            row.appendChild(page);
            row.appendChild(views);

            tbody.appendChild(row);
        });
    })
    .catch(error => {
        console.error("Statistics error:", error);
    });
</script>

</body>
</html>
