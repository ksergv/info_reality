<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site Statistics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        h1 {
            margin-bottom: 30px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 25px;
            min-width: 120px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 5px;
        }

        .day {
            margin-bottom: 30px;
        }

        .day-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .day-total {
            color: #666;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th:last-child,
        td:last-child {
            text-align: right;
            width: 80px;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

<h1>Site Statistics</h1>

<div class="summary">

    <div class="card">
        <div>Today</div>
        <div class="number" id="today">—</div>
    </div>

    <div class="card">
        <div>Total</div>
        <div class="number" id="total">—</div>
    </div>

</div>

<div id="statistics">
    Loading...
</div>

<script>

fetch("https://sksek.duckdns.org/counter/stats")

    .then(response => {
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        return response.json();
    })

    .then(data => {

        document.getElementById("today").textContent = data.today;
        document.getElementById("total").textContent = data.total;

        const container = document.getElementById("statistics");

        container.innerHTML = "";

        Object.entries(data.days).forEach(([day, info]) => {

            const section = document.createElement("div");
            section.className = "day";

            const header = document.createElement("div");
            header.className = "day-header";

            const date = new Date(day + "T12:00:00");

            header.textContent = date.toLocaleDateString(
                "en-GB",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

            section.appendChild(header);

            const total = document.createElement("div");
            total.className = "day-total";

            total.textContent = "Total views: " + info.total;

            section.appendChild(total);

            const table = document.createElement("table");

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Page</th>
                        <th>Views</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

            const tbody = table.querySelector("tbody");

            info.pages.forEach(item => {

                const row = document.createElement("tr");

                const page = document.createElement("td");
                page.textContent = item.page;

                const views = document.createElement("td");
                views.textContent = item.views;

                row.appendChild(page);
                row.appendChild(views);

                tbody.appendChild(row);
            });

            section.appendChild(table);

            container.appendChild(section);
        });
    })

    .catch(error => {

        document.getElementById("statistics").innerHTML =
            '<div class="error">Unable to load statistics.</div>';

        console.error(error);
    });

</script>

</body>
</html>
